[project]
name = "purchase-intent-service"
version = "0.1.0"
description = "Service for predicting buyers intention"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "pandas",
    "scikit-learn",
    "joblib",
    "numpy"
]

[dependency-groups]
data = [
    "kagglehub>=1.0.2",
]
dev = [
    "pytest",
    "httpx2",
    "locust",
    "ruff",
    "pre-commit"
]
notebooks = [
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "ipykernel",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "purchase_intent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
