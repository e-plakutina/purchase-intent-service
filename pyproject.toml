[project]
name = "purchase-intent-service"
version = "0.1.0"
description = "Service for predicting buyers intention"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "pandas",
    "scikit-learn",
    "joblib"
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "locust",
    "ruff",
    "pre-commit"
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "purchase_intent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
